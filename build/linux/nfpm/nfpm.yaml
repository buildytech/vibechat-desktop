# Linux .deb of BuildY VibeChat (scripts/package.sh: wails3 tool package -format deb). Identity: internal/appid.
name: "vibechat"
arch: ${GOARCH}
platform: "linux"
version: "${VIBECHAT_VERSION}"
section: "web"
priority: "optional"
maintainer: "BuildY"
description: "BuildY VibeChat desktop: a window to your own vibechat-server (Debian 13), where the Cursor agent runs."
vendor: "BuildY"
homepage: "https://github.com/buildytech/vibechat-desktop"
license: "Apache-2.0"
release: "1"

contents:
  - src: "./bin/vibechat"
    dst: "/usr/bin/vibechat"
  - src: "./build/appicon.png"
    dst: "/usr/share/pixmaps/vibechat.png"
  - src: "./build/linux/vibechat.desktop"
    dst: "/usr/share/applications/vibechat.desktop"

# GTK 4 + WebKitGTK 6.0 (Ubuntu 24.04+ / Debian 13+), as built in CI.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
