<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>Building…</title>
  <style>
    :root {
      --background: #080808;
      --foreground: #ededed;
      --muted: #1c1c1c;
      --muted-foreground: #a0a0a0;
      --primary: #fab283;
      --border: #282828;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--foreground);
      font: 16px/24px system-ui, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 48px 16px;
    }
    .wait {
      display: grid;
      justify-items: center;
      gap: 16px;
      width: min(100%, 360px);
      text-align: center;
    }
    .icon { color: var(--primary); animation: spin 1.2s linear infinite; }
    h1 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; }
    .step, .hint, .elapsed { margin: 0; color: var(--muted-foreground); }
    .step { font-size: 14px; line-height: 24px; }
    .elapsed, .hint { font-size: 12px; line-height: 16px; }
    .elapsed { font-variant-numeric: tabular-nums; }
    .bar {
      position: relative;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: var(--muted);
      overflow: hidden;
    }
    .bar-fill {
      position: absolute;
      top: 0; bottom: 0;
      width: 40%;
      border-radius: inherit;
      background: var(--primary);
      animation: indeterminate 1.6s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes indeterminate { 0% { left: -40%; } 100% { left: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      .icon, .bar-fill { animation: none; }
      .bar-fill { left: 0; width: 60%; }
    }
  </style>
</head>
<body>
  <div class="wait" role="status" aria-live="polite" aria-busy="true">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
    </svg>
    <h1 data-i18n="title">Building the Go site</h1>
    <p class="step" data-i18n="step">templ generate, go build</p>
    <div class="bar" aria-hidden="true"><div class="bar-fill"></div></div>
    <p class="elapsed"><span data-i18n="elapsedBefore">Elapsed </span><time id="elapsed">0:00</time></p>
    <p class="hint" data-i18n="hint">This page reloads by itself. It usually takes one to two minutes.</p>
  </div>
  <script>
    (function () {
      var ru = String(navigator.language || "").toLowerCase().indexOf("ru") === 0;
      var copy = ru ? {
        title: "Собираем Go-сайт",
        step: "templ generate, go build",
        elapsedBefore: "Прошло ",
        hint: "Страница обновится сама. Обычно это занимает полторы–две минуты.",
        docTitle: "Сборка…"
      } : {
        title: "Building the Go site",
        step: "templ generate, go build",
        elapsedBefore: "Elapsed ",
        hint: "This page reloads by itself. It usually takes one to two minutes.",
        docTitle: "Building…"
      };
      document.documentElement.lang = ru ? "ru" : "en";
      document.title = copy.docTitle;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var key = el.getAttribute("data-i18n");
        if (key && copy[key] != null) el.textContent = copy[key];
      });

      function formatElapsed(seconds) {
        var total = Math.max(0, Math.floor(seconds));
        var m = Math.floor(total / 60);
        var s = total % 60;
        return m + ":" + String(s).padStart(2, "0");
      }

      var key = "vibechat-building-started:" + location.host;
      var started = 0;
      try { started = Number(sessionStorage.getItem(key) || 0); } catch (e) {}
      if (!started) {
        started = Date.now();
        try { sessionStorage.setItem(key, String(started)); } catch (e) {}
      }
      if (window.__SHOT_ELAPSED_MS) started = Date.now() - window.__SHOT_ELAPSED_MS;

      var elapsedEl = document.getElementById("elapsed");
      function tick() {
        elapsedEl.textContent = formatElapsed((Date.now() - started) / 1000);
      }
      tick();
      setInterval(tick, 1000);

      function poll() {
        fetch(location.href, { cache: "no-store" }).then(function (res) {
          if (res.status !== 503) location.reload();
        }).catch(function () {}).finally(function () {
          setTimeout(poll, 3000);
        });
      }
      setTimeout(poll, 3000);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="3"></noscript>
</body>
</html>
