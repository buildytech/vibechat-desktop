name: ci
on:
  push:
    branches: [main]
    # A v* tag builds the same matrix and publishes a GitHub Release with the portable zips (job release).
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The desktop app (desktop/): a window to the owner's vibechat-server, no local agent. Start screen from the pinned
  # studio (build:shell), the app's tests, the build, the check that it links no server or agent code, installers.
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 runners are Apple Silicon (arm64): the macOS zip is the arm64 build.
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      # The app version: scripts/package.sh and the desktop build stamp it (internal/appid.Version); a v* tag wins.
      VIBECHAT_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.2.4' }}
    defaults:
      run:
        shell: bash
    steps:
      # The submodules (buildytech/studio, buildytech/templates) are public: the job token is enough.
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Linux GUI libraries (GTK 4, WebKitGTK 6)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Start screen from the pinned studio submodule (build:shell)
        run: bash scripts/build-shell.sh
      - name: Vet
        run: go vet ./ ./protocol/... ./internal/... ./desktop/...
      - name: Tests (the app, its contract, the shared packages)
        run: go test -count=1 -v ./ ./protocol/... ./internal/... ./desktop/...
      - name: Desktop build
        run: go build -ldflags "-X github.com/buildytech/vibechat-desktop/internal/appid.Version=$VIBECHAT_VERSION" -o bin/vibechat ./desktop/cmd/vibechat
      # No local agent in the app: the Go packages it links (only desktop/, protocol/ and four shared ones) and the
      # binary itself (no bridge, sandbox, hook, templates or server markers).
      - name: No local agent in the desktop build
        run: |
          exe=bin/vibechat; [ -f bin/vibechat.exe ] && exe=bin/vibechat.exe
          bash scripts/check-desktop.sh "$exe"
      # Can this platform's webview frame the server's preview gateway at http://<id>.preview.localhost:<port>
      # (WebView2 / WKWebView / WebKitGTK)? Real window, fake gateway; prints one JSON line. Reported, not gating.
      - name: Webview *.localhost probe
        timeout-minutes: 3
        run: |
          set +e
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get install -y xvfb >/dev/null
              GTK_A11Y=none xvfb-run -a bin/vibechat --probe-localhost; code=$?
              if [ "$code" != 0 ]; then
                echo "retry with the WebKit sandbox off (Ubuntu runner: AppArmor restricts user namespaces)"
                GTK_A11Y=none WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 xvfb-run -a bin/vibechat --probe-localhost; code=$?
              fi ;;
            Windows) cp bin/vibechat bin/vibechat-probe.exe && bin/vibechat-probe.exe --probe-localhost; code=$? ;;
            macOS)   bin/vibechat --probe-localhost; code=$? ;;
          esac
          [ "$code" = 0 ] || echo "::warning::webview *.localhost probe failed on $RUNNER_OS (exit $code)"
          exit 0
      - name: Packaging tools (wails3 CLI of the pinned Wails; NSIS on Windows)
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          if [ "$RUNNER_OS" = "Windows" ] && ! command -v makensis >/dev/null; then
            choco install nsis -y --no-progress >/dev/null
            echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y dpkg-dev file >/dev/null; fi
      - name: Unsigned installers and portable zips (scripts/package.sh)
        run: |
          export VIBECHAT_VERSION="${VIBECHAT_VERSION#v}"
          bash scripts/package.sh
          ls dist/vibechat-desktop-*.zip
      # The shipped executable again: no agent runtime next to it, no local agent inside, and it starts (--version).
      - name: Shipped app (portable zip) is the thin client
        run: |
          root="$RUNNER_TEMP/Профиль пользователя/Downloads"
          rm -rf "$root" && mkdir -p "$root"
          zip=$(ls dist/vibechat-desktop-*.zip)
          case "$RUNNER_OS" in
            Windows) 7z x -bso0 -bsp0 -o"$root" "$zip"; exe="$root/vibechat-desktop-windows-x64/vibechat.exe" ;;
            macOS)   ditto -x -k "$zip" "$root"; exe="$root/BuildY VibeChat.app/Contents/MacOS/vibechat" ;;
            Linux)   unzip -q "$zip" -d "$root"; exe="$root/vibechat-desktop-linux-x64/vibechat" ;;
          esac
          if find "$root" -name bridge -o -name cursor-sdk-bridge -o -name 'cursorsandbox*' | grep -q .; then
            echo "the shipped app carries an agent runtime" >&2; find "$root" | head -50; exit 1
          fi
          bash scripts/check-desktop.sh "$exe"
          if [ "$RUNNER_OS" != Linux ]; then "$exe" --version || true; fi
      # The same probe from the shipped .app: its Info.plist (App Transport Security exceptions for localhost and its
      # subdomains) applies only inside the bundle. Reported, not gating.
      - name: Webview *.localhost probe (macOS .app bundle)
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: |
          set +e
          "bin/BuildY VibeChat.app/Contents/MacOS/vibechat" --probe-localhost; code=$?
          [ "$code" = 0 ] || echo "::warning::webview *.localhost probe failed in the macOS .app (exit $code)"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: vibechat-${{ matrix.os }}
          path: |
            bin/vibechat
            bin/vibechat.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: vibechat-installer-${{ matrix.os }}
          path: dist/
          retention-days: 14

  # vibechat-server (server/): the Studio from the pinned studio submodule, the server's tests (the host seam contract,
  # the agent, templates, previews), project creation with the oldest and the current Bun, the agent runtime
  # (cursor-sdk-bridge on the Bun baseline build, checked statically and under QEMU without AVX2) and the .deb.
  server:
    runs-on: ubuntu-24.04
    env:
      VIBECHAT_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.2.4' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Studio from the pinned studio submodule
        run: bash scripts/build-frontend.sh
      - name: Vet
        run: go vet ./server/...
      - name: Tests (unit, host seam contract)
        run: go test -count=1 -v ./server/...
      # Project creation e2e (templates.Scaffold + host.InstallDeps, the server's code) with the oldest supported Bun
      # and the current one, under a parent folder with spaces and Cyrillic.
      - name: Templates install e2e (Bun 1.3.3)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Templates install e2e run (Bun 1.3.3)
        run: |
          bun --version
          d="$RUNNER_TEMP/Профиль пользователя/VibeChat 133"
          mkdir -p "$d"
          VIBECHAT_E2E_INSTALL=1 VIBECHAT_E2E_DIR="$d" go test -count=1 -v -run TestTemplatesInstallE2E ./server
      - name: Templates install e2e (current Bun)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Templates install e2e run (current Bun)
        run: |
          bun --version
          d="$RUNNER_TEMP/Профиль пользователя/VibeChat 144"
          mkdir -p "$d"
          VIBECHAT_E2E_INSTALL=1 VIBECHAT_E2E_DIR="$d" go test -count=1 -v -run TestTemplatesInstallE2E ./server
      - name: Server build (server/cmd/vibechat-server, net/http)
        run: go build -ldflags "-X github.com/buildytech/vibechat-desktop/internal/appid.Version=$VIBECHAT_VERSION" -o bin/vibechat-server-check ./server/cmd/vibechat-server
      - name: Packaging tools (the wails3 CLI without cgo, no GTK here; its nfpm packs the .deb)
        run: |
          CGO_ENABLED=0 go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          sudo apt-get update && sudo apt-get install -y dpkg-dev file >/dev/null
      - name: Agent runtime (server/cmd/fetch-bridge, server/bridge.lock.json)
        run: go run ./server/cmd/fetch-bridge -out bin/bridge -cache "${BRIDGE_CACHE:-.bridge-cache}"
      # x64 bridges are recompiled on the Bun baseline runtime (baselineRuntime in the lock): the upstream build needs
      # AVX2 and dies with SIGILL on older CPUs. Static check: manifest runtime bun-*-baseline, machine code identical
      # to the pinned baseline Bun.
      - name: Bridge is the Bun baseline build (x64)
        run: go run ./server/cmd/fetch-bridge -verify bin/bridge -cache "${BRIDGE_CACHE:-.bridge-cache}"
      # Dynamic check on a CPU without AVX/AVX2: QEMU user mode, -cpu Nehalem-v2, bridge until ready, the sandbox
      # helper and rg; the upstream AVX2 bridge as the control must hit SIGILL there.
      - name: Bridge without AVX2 (QEMU -cpu Nehalem-v2)
        run: |
          sudo apt-get install -y qemu-user >/dev/null
          bash scripts/bridge-qemu-smoke.sh bin/bridge "${BRIDGE_CACHE:-.bridge-cache}/cursor-sdk-bridge-standalone-linux-x64.tar.gz"
      # The server .deb: /usr/lib/vibechat-server + systemd units (vibechat-server, vibechat-update.timer).
      - name: Server package (scripts/package-server.sh)
        run: |
          export VIBECHAT_VERSION="${VIBECHAT_VERSION#v}"
          bash scripts/package-server.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vibechat-server
          path: dist/vibechat-server-linux-amd64.deb
          if-no-files-found: error
          retention-days: 14

  # The server .deb on Debian 13 (the only supported server OS): a Debian 13 Incus VM (real Debian kernel, systemd)
  # with the install + auth smoke and the SDK sandbox preflight required, then an Incus container inside it like a
  # user's server (scripts/ci-server-debian.sh). The .deb comes from the server job.
  server-debian:
    needs: server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The desktop's Go packages embed the pinned seam contract (third_party/studio); templates are not needed.
      - name: Studio submodule (the seam contract)
        run: git submodule update --init --depth 1 third_party/studio
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: vibechat-server
          path: dist
      - name: Server on Debian 13 (Incus VM, the desktop SSH connection e2e, then an Incus container inside it)
        run: bash scripts/ci-server-debian.sh dist/vibechat-server-linux-amd64.deb

  # The setup wizard of a user's server end to end (scripts/ci-provision-e2e.sh): a fresh Debian 13 Incus VM with
  # sshd and a root password like a VPS; the wizard runs twice (lockdown rollback without a confirmation, then the
  # rerun skipping what is done), then limits, egress allowlist, keys-only sshd and the app's connection are checked.
  provision-debian:
    needs: server
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The desktop's Go packages embed the pinned seam contract (third_party/studio); templates are not needed.
      - name: Studio submodule (the seam contract)
        run: git submodule update --init --depth 1 third_party/studio
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: vibechat-server
          path: dist
      - name: Setup wizard on a Debian 13 VPS (Incus VM)
        run: bash scripts/ci-provision-e2e.sh dist/vibechat-server-linux-amd64.deb

  # Tag v* → GitHub Release with stable asset names and body from docs/releases/<tag>.md, so
  # https://github.com/buildytech/vibechat-desktop/releases/latest/download/<name> always points at the newest build.
  release:
    needs: [build, server, server-debian, provision-debian]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: vibechat-installer-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: vibechat-server
          path: dist
      # Body is docs/releases/<tag>.md only; a missing file fails the job before publish.
      - name: Release notes
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || { echo "release: missing $notes — add the notes file for this tag before publishing" >&2; exit 1; }
      # SHA256SUMS of every asset: vibechat-server update checks the server .deb against it before dpkg -i.
      # One list (assets.txt) is both what SHA256SUMS covers and what gets uploaded: the names must match exactly.
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          # Asset names must survive upload unchanged (GitHub turns a space into a dot), or sha256sum -c fails.
          printf '%s\n' vibechat-desktop-linux-x64.zip vibechat-desktop-windows-x64.zip vibechat-desktop-macos-arm64.zip \
            *.deb vibechat-amd64-installer.exe BuildY-VibeChat.dmg | sort -u > ../assets.txt
          while read -r f; do
            case "$f" in *[!A-Za-z0-9._-]*) echo "release: asset name GitHub would change: $f" >&2; exit 1 ;; esac
            [ -f "$f" ] || { echo "release: missing asset $f" >&2; exit 1; }
          done < ../assets.txt
          xargs -a ../assets.txt sha256sum -- > SHA256SUMS
          cat SHA256SUMS
          # Every name in SHA256SUMS is an asset and every asset is in SHA256SUMS.
          diff <(awk '{print $2}' SHA256SUMS | sort) ../assets.txt || { echo "release: SHA256SUMS names differ from the assets" >&2; exit 1; }
          sha256sum -c --strict SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l dist
          mapfile -t files < <(sed 's|^|dist/|' assets.txt)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "BuildY VibeChat $GITHUB_REF_NAME" --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            "${files[@]}" dist/SHA256SUMS
      # What users download: the release's asset names against SHA256SUMS (both ways), then sha256sum -c on the
      # downloaded files.
      - name: Check the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep -vx SHA256SUMS | sort > published.txt
          diff published.txt assets.txt || { echo "release: published assets differ from the built ones" >&2; exit 1; }
          gh release download "$GITHUB_REF_NAME" -D published
          cd published
          diff <(awk '{print $2}' SHA256SUMS | sort) ../published.txt || { echo "release: SHA256SUMS names differ from the published assets" >&2; exit 1; }
          diff <(ls | grep -vx SHA256SUMS | sort) ../published.txt || { echo "release: downloaded files differ" >&2; exit 1; }
          sha256sum -c --strict SHA256SUMS
