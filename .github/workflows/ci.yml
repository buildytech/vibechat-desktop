name: ci
on:
  push:
    branches: [main]
    # A v* tag builds the same matrix and publishes a GitHub Release with the portable zips (job release).
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 runners are Apple Silicon (arm64): the macOS zip is the arm64 build.
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      # The app version: scripts/package.sh and the desktop build stamp it (internal/appid.Version); a v* tag wins.
      VIBECHAT_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.7' }}
    defaults:
      run:
        shell: bash
    steps:
      # The submodules (buildytech/studio, buildytech/templates) are public: the job token is enough.
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Linux GUI libraries (GTK 4, WebKitGTK 6)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Studio from the pinned studio submodule
        run: bash scripts/build-frontend.sh
      - name: Vet
        run: go vet ./ ./internal/... ./cmd/...
      - name: Tests (unit, host seam contract)
        run: go test -count=1 -v ./ ./internal/... ./cmd/...
      # Project creation e2e (templates.Scaffold + host.InstallDeps, the app's code) with the oldest supported Bun and
      # the current one, under a parent folder with spaces and Cyrillic like a real user profile.
      - name: Templates install e2e (Bun 1.3.3)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Templates install e2e run (Bun 1.3.3)
        run: |
          bun --version
          d="$RUNNER_TEMP/Профиль пользователя/VibeChat 133"
          mkdir -p "$d"
          VIBECHAT_E2E_INSTALL=1 VIBECHAT_E2E_DIR="$d" go test -count=1 -v -run TestTemplatesInstallE2E .
      - name: Templates install e2e (current Bun)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Templates install e2e run (current Bun)
        run: |
          bun --version
          d="$RUNNER_TEMP/Профиль пользователя/VibeChat 144"
          mkdir -p "$d"
          VIBECHAT_E2E_INSTALL=1 VIBECHAT_E2E_DIR="$d" go test -count=1 -v -run TestTemplatesInstallE2E .
      # The old headless Wails build (no auth, loopback): kept for local tests and the exam until they move to
      # cmd/vibechat-server.
      - name: Headless build (Wails, server tag)
        run: go build -tags server -ldflags "-X github.com/buildytech/vibechat-desktop/internal/appid.Version=$VIBECHAT_VERSION" -o bin/vibechat-headless ./cmd/vibechat
      - name: Server build (cmd/vibechat-server, net/http)
        run: go build -ldflags "-X github.com/buildytech/vibechat-desktop/internal/appid.Version=$VIBECHAT_VERSION" -o bin/vibechat-server-check ./cmd/vibechat-server
      - name: Desktop build
        run: go build -ldflags "-X github.com/buildytech/vibechat-desktop/internal/appid.Version=$VIBECHAT_VERSION" -o bin/vibechat ./cmd/vibechat
      # Can this platform's webview frame the server's preview gateway at http://<id>.preview.localhost:<port>
      # (WebView2 / WKWebView / WebKitGTK)? Real window, fake gateway; prints one JSON line. Reported, not gating.
      - name: Webview *.localhost probe
        timeout-minutes: 3
        run: |
          set +e
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get install -y xvfb >/dev/null
              GTK_A11Y=none xvfb-run -a bin/vibechat --probe-localhost; code=$?
              if [ "$code" != 0 ]; then
                echo "retry with the WebKit sandbox off (Ubuntu runner: AppArmor restricts user namespaces)"
                GTK_A11Y=none WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 xvfb-run -a bin/vibechat --probe-localhost; code=$?
              fi ;;
            Windows) cp bin/vibechat bin/vibechat-probe.exe && bin/vibechat-probe.exe --probe-localhost; code=$? ;;
            macOS)   bin/vibechat --probe-localhost; code=$? ;;
          esac
          [ "$code" = 0 ] || echo "::warning::webview *.localhost probe failed on $RUNNER_OS (exit $code)"
          exit 0
      - name: Packaging tools (wails3 CLI of the pinned Wails; NSIS on Windows)
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          if [ "$RUNNER_OS" = "Windows" ] && ! command -v makensis >/dev/null; then
            choco install nsis -y --no-progress >/dev/null
            echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y dpkg-dev file >/dev/null; fi
      - name: Unsigned installers and portable zips (scripts/package.sh)
        run: |
          export VIBECHAT_VERSION="${VIBECHAT_VERSION#v}"
          bash scripts/package.sh
          ls dist/vibechat-desktop-*.zip
      # The server .deb (Linux): /usr/lib/vibechat-server + systemd units (vibechat-server, vibechat-update.timer).
      - name: Server package (scripts/package-server.sh, Linux)
        if: runner.os == 'Linux'
        run: |
          export VIBECHAT_VERSION="${VIBECHAT_VERSION#v}"
          bash scripts/package-server.sh
      # The same probe from the shipped .app: its Info.plist (App Transport Security exceptions for localhost and its
      # subdomains) applies only inside the bundle. Reported, not gating.
      - name: Webview *.localhost probe (macOS .app bundle)
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: |
          set +e
          "bin/BuildY VibeChat.app/Contents/MacOS/vibechat" --probe-localhost; code=$?
          [ "$code" = 0 ] || echo "::warning::webview *.localhost probe failed in the macOS .app (exit $code)"
          exit 0
      # Agent runtime smoke from the shipped zip: unpack under a path with spaces and Cyrillic, run the app's own
      # --bridge-smoke (locate bridge next to the exe, sandbox preflight, private HOME/USERPROFILE, ready + Ping).
      - name: Bridge smoke from the portable zip
        run: |
          root="$RUNNER_TEMP/Профиль пользователя/Downloads"
          rm -rf "$root" && mkdir -p "$root"
          zip=$(ls dist/vibechat-desktop-*.zip)
          case "$RUNNER_OS" in
            Windows) 7z x -bso0 -bsp0 -o"$root" "$zip"; exe="$root/vibechat-desktop-windows-x64/vibechat.exe" ;;
            macOS)   ditto -x -k "$zip" "$root"; exe="$root/BuildY VibeChat.app/Contents/MacOS/vibechat" ;;
            Linux)   unzip -q "$zip" -d "$root"; exe="$root/vibechat-desktop-linux-x64/vibechat" ;;
          esac
          export VIBECHAT_DATA_DIR="$RUNNER_TEMP/Профиль пользователя/AppData/tw.buildy.vibechat"
          "$exe" --version > smoke.txt 2>&1 || true
          set +e
          "$exe" --bridge-smoke >> smoke.txt 2>&1
          code=$?
          set -e
          cat smoke.txt
          echo "--- log"; cat "$VIBECHAT_DATA_DIR/logs/vibechat.log" || true
          # 3 = the runner has no SDK sandbox (GitHub Linux runners lack Landlock); the bridge is not started then.
          if [ "$code" = 3 ] && [ "$RUNNER_OS" = Linux ]; then echo "::warning::bridge smoke skipped: no SDK sandbox on this runner"; exit 0; fi
          exit $code
      # x64 bridges are recompiled on the Bun baseline runtime (cmd/fetch-bridge, bridge.lock.json baselineRuntime):
      # the upstream build needs AVX2 and dies with 0xC000001D / SIGILL on older CPUs. Static check of the shipped
      # folder: manifest runtime bun-*-baseline and machine code identical to the pinned baseline Bun.
      - name: Bridge is the Bun baseline build (x64)
        if: runner.os != 'macOS'
        run: |
          root="$RUNNER_TEMP/Профиль пользователя/Downloads"
          case "$RUNNER_OS" in
            Windows) d="$root/vibechat-desktop-windows-x64/bridge" ;;
            Linux)   d="$root/vibechat-desktop-linux-x64/bridge" ;;
          esac
          go run ./cmd/fetch-bridge -verify "$d" -cache "${BRIDGE_CACHE:-.bridge-cache}"
      # Dynamic check on a CPU without AVX/AVX2: QEMU user mode, -cpu Nehalem-v2, bridge until ready, the sandbox
      # helper and rg; the upstream AVX2 bridge as the control must hit SIGILL there.
      - name: Bridge without AVX2 (QEMU -cpu Nehalem-v2, Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y qemu-user >/dev/null
          root="$RUNNER_TEMP/Профиль пользователя/Downloads"
          bash scripts/bridge-qemu-smoke.sh "$root/vibechat-desktop-linux-x64/bridge" "${BRIDGE_CACHE:-.bridge-cache}/cursor-sdk-bridge-standalone-linux-x64.tar.gz"
      # The NSIS installer layout (per-machine, Program Files, read-only for the user): the same smoke from there.
      - name: Bridge smoke from the installed app (Windows)
        if: runner.os == 'Windows'
        run: |
          powershell -NoProfile -Command "Start-Process -FilePath dist\vibechat-amd64-installer.exe -ArgumentList '/S' -Wait"
          exe="/c/Program Files/BuildY/BuildY VibeChat/vibechat.exe"
          ls -la "$(dirname "$exe")" "$(dirname "$exe")/bridge"
          go run ./cmd/fetch-bridge -verify "$(dirname "$exe")/bridge" -cache "${BRIDGE_CACHE:-.bridge-cache}"
          unset VIBECHAT_DATA_DIR # the real default: %APPDATA%\tw.buildy.vibechat
          set +e
          "$exe" --bridge-smoke > smoke-installed.txt 2>&1
          code=$?
          set -e
          cat smoke-installed.txt
          echo "--- log"; cat "$APPDATA/tw.buildy.vibechat/logs/vibechat.log" || true
          exit $code
      # A real agent run (Composer 2.5 Fast, "Reply OK") through the app's path: menu from the key's model list →
      # Select → create → Send. Only when the repository has the VIBECHAT_LIVE_CURSOR_KEY secret (a Cursor-type key);
      # skipped otherwise. Windows: GitHub Linux runners have no SDK sandbox.
      - name: Live agent run (Windows, VIBECHAT_LIVE_CURSOR_KEY secret only)
        if: runner.os == 'Windows'
        env:
          CURSOR_API_KEY: ${{ secrets.VIBECHAT_LIVE_CURSOR_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then echo "::notice::no VIBECHAT_LIVE_CURSOR_KEY secret: live agent run skipped"; exit 0; fi
          hook=$(ls "$PWD"/bin/vibechat.exe 2>/dev/null || echo "$PWD/bin/vibechat")
          VIBECHAT_BRIDGE_DIR="$PWD/bin/bridge" VIBECHAT_HOOK_EXE="$hook" VIBECHAT_LIVE_MENU=cursor/composer-2.5-fast \
            go test -count=1 -tags live -run TestLiveMenuRuns -v ./internal/agent
      # The bare executable with the agent runtime next to it (bin/bridge: cursor-sdk-bridge + sandbox helper).
      - uses: actions/upload-artifact@v4
        with:
          name: vibechat-${{ matrix.os }}
          path: |
            bin/vibechat
            bin/vibechat.exe
            bin/bridge/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: vibechat-installer-${{ matrix.os }}
          path: dist/
          retention-days: 14

  # The server .deb on Debian 13 (the only supported server OS): a Debian 13 Incus VM (real Debian kernel, systemd)
  # with the install + auth smoke and the SDK sandbox preflight required, then an Incus container inside it like a
  # user's server (scripts/ci-server-debian.sh). The binaries are still built on the Ubuntu runner above.
  server-debian:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: vibechat-installer-ubuntu-24.04
          path: dist
      - name: Server on Debian 13 (Incus VM, the desktop SSH connection e2e, then an Incus container inside it)
        run: bash scripts/ci-server-debian.sh dist/vibechat-server-linux-amd64.deb

  # The setup wizard of a user's server end to end (scripts/ci-provision-e2e.sh): a fresh Debian 13 Incus VM with
  # sshd and a root password like a VPS; the wizard runs twice (lockdown rollback without a confirmation, then the
  # rerun skipping what is done), then limits, egress allowlist, keys-only sshd and the app's connection are checked.
  provision-debian:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: vibechat-installer-ubuntu-24.04
          path: dist
      - name: Setup wizard on a Debian 13 VPS (Incus VM)
        run: bash scripts/ci-provision-e2e.sh dist/vibechat-server-linux-amd64.deb

  # Tag v* → GitHub Release with stable asset names, so
  # https://github.com/buildytech/vibechat-desktop/releases/latest/download/<name> always points at the newest build.
  release:
    needs: [build, server-debian, provision-debian]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vibechat-installer-*
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          ## 0.1.7

          **New: server setup wizard / Новое: мастер настройки сервера.** Settings → Set up a new server: enter a fresh
          Debian 13 VPS's address and the root password once (kept in memory for this run only, never stored). Over SSH
          the app runs ten idempotent steps: checks the system (Debian 13 x86_64 only, otherwise it stops), installs
          Incus (no network API: the app never gets Incus access), creates an unprivileged Debian 13 container
          (`security.nesting`, 2 CPU / 4 GiB / 15 GiB, the disk quota enforced on a btrfs pool), installs
          vibechat-server (`.deb` checked against `SHA256SUMS`) and Bun, limits the container's internet to Cursor, npm,
          Bun and GitHub (an Incus network ACL by IP, refreshed every 10 minutes), puts a new host token straight into the
          app's keychain, adds a `vibechat-tunnel` user that may only forward the two ports, pins the host key, checks the
          connection, and finally turns off SSH password login (root included). A `systemd-run` timer turns password login
          back on after 5 minutes unless the app confirms that its own key login works. An optional root public key can be
          added in the form. Then the app connects to the server.

          Настройки → «Настроить новый сервер»: адрес и пароль root вводятся один раз (пароль не сохраняется); мастер ставит
          Incus и изолированный контейнер с vibechat-server (2 CPU, 4 ГБ, 15 ГБ; интернет только Cursor, npm, Bun и GitHub)
          и отключает вход по паролю с откатом через 5 минут, если приложение не подтвердит вход своим ключом.

          **Settings → Server help / Справка по серверу:** signing in as root with your own SSH key once password login is
          off, and backups of `/var/lib/vibechat` to S3 with restic.

          **Fixed: `SHA256SUMS`.** In v0.1.6 the macOS installer was listed as `BuildY VibeChat.dmg` while the asset is
          `BuildY.VibeChat.dmg`, so `sha256sum -c` failed for it. The asset is now `BuildY-VibeChat.dmg`, and the release
          checks that the names in `SHA256SUMS` and the assets match both ways and that `sha256sum -c` passes before and
          after publishing.

          **Not verified on a real VPS yet** (the wizard is tested end to end in CI on a Debian 13 Incus VM only):
          provider images and cloud-init setups; hosts where ssh is socket-activated; IPv6-only hosts (IPv6 is off on
          the container network); CDN addresses drifting over days (the allowlist is by IP, so another site on the same CDN
          address is reachable too); real Cursor agent traffic through the allowlist (only `api2.cursor.sh` was checked;
          wildcard subdomains are not covered); DNS through the host's resolver as a possible small leak channel; `apt` in
          the container is blocked after setup (server updates come from GitHub releases); the wizard with the macOS and
          Windows keychains and the card in the installed app. A second run after the lockdown cannot sign in with the
          password (by design): use your own root key or the provider's web console. Please report problems.

          Also still not verified on a real Mac: the per-port previews on macOS (`VIBECHAT_PREVIEW_PORTS=0` turns them off).

          ## Server mode over SSH / Режим сервера по SSH

          Settings → Server connects the app to a vibechat-server over SSH built into the app (no `ssh` binary): the app's
          ed25519 key and the host token stay in the OS keychain, the host key is pinned on the first connect, previews are
          forwarded, the Cursor key is stored on the server.

          `SHA256SUMS` lists the SHA-256 of every asset (the server's self-update checks the `.deb` against it).

          Portable builds (unzip and run; the agent runtime `bridge/` sits next to the executable):

          | System | Download | Requirements |
          |---|---|---|
          | Linux x64 | [vibechat-desktop-linux-x64.zip](https://github.com/buildytech/vibechat-desktop/releases/latest/download/vibechat-desktop-linux-x64.zip) | GTK 4 + WebKitGTK 6 (`sudo apt install libgtk-4-1 libwebkitgtk-6.0-4`), Ubuntu 24.04 / Debian 13 or newer |
          | Windows x64 | [vibechat-desktop-windows-x64.zip](https://github.com/buildytech/vibechat-desktop/releases/latest/download/vibechat-desktop-windows-x64.zip) | Windows 10/11 x64 with Microsoft Edge WebView2 (the installer adds it if missing) |
          | macOS Apple Silicon | [vibechat-desktop-macos-arm64.zip](https://github.com/buildytech/vibechat-desktop/releases/latest/download/vibechat-desktop-macos-arm64.zip) | macOS 12+ on M1 or newer |

          x64 builds run on any x86-64 CPU with SSE4.2 (no AVX/AVX2 needed): the agent runtime is compiled on the Bun
          *baseline* runtime and checked in CI under QEMU `-cpu Nehalem-v2`.

          Installers are attached too: `.deb` (Linux), `vibechat-amd64-installer.exe` (Windows), `BuildY-VibeChat.dmg` (macOS).

          Server (preview; requires Debian 13 "trixie" x86_64, Ubuntu and other systems are not supported for now; one
          Incus container per user):
          [vibechat-server-linux-amd64.deb](https://github.com/buildytech/vibechat-desktop/releases/latest/download/vibechat-server-linux-amd64.deb)
          — the agent host on 127.0.0.1 only (reach it through SSH), host token, Cursor key in a 0600 file on the server,
          daily self-update from these releases (`vibechat-update.timer`, checked against `SHA256SUMS`). The desktop
          app connects to it over SSH built into the app: Settings → Server.

          Builds are **not signed or notarized**.
          - macOS: after unzipping, run `xattr -dr com.apple.quarantine "BuildY VibeChat.app"` (or right-click → Open).
          - Windows: SmartScreen may warn — «More info» → «Run anyway».

          Projects need [Bun](https://bun.sh) 1.3.3 or newer on PATH (`bun upgrade`). Then `vibechat --set-key` (paste the Cursor
          API key, kept in the OS keychain) or set it in Settings.
          The key is an API key of type **Cursor** (`grok_…`) from https://grok.com/dashboard/api-keys ("Grok API" `xai-…`
          keys do not work). `vibechat --check-key > check.txt` checks it with Cursor and writes a diagnostic without the key.

          ## Windows: no sandbox / Windows: без песочницы

          Local mode (the agent on this computer) is unchanged. On Windows the local agent runs **without a sandbox** (cursor-sdk-bridge has
          no filesystem sandbox on win32; its helper is a network proxy only), and the app shows a warning:
          - arbitrary shell commands with your user's rights **and network access** (the curl/wget blocklist is easy to
            get around: PowerShell `iwr`, `bun -e fetch`, `git clone`, `npm i`);
          - shell commands can write and read **outside the project** (hooks check file tools and the shell's working
            directory only);
          - **no approval** step (without the sandbox the SDK approves every action);
          - the Cursor key is in the bridge's environment and **likely visible to the agent's shell**.

          Open only trusted projects on Windows. macOS (Seatbelt) and Linux (Landlock + bubblewrap) run the agent in the
          SDK sandbox: writes only in the project, no network, fail closed.

          On Windows prefer server mode (above): the agent then runs in the SDK sandbox on your Debian 13 server, set up by
          the wizard (Settings → Set up a new server).

          В Windows локальный агент работает без песочницы: открывайте только доверенные проекты или используйте режим
          сервера (агент в песочнице на вашем сервере Debian 13).

          Log for bug reports: Windows `%APPDATA%\tw.buildy.vibechat\logs\vibechat.log`, macOS
          `~/Library/Application Support/tw.buildy.vibechat/logs/vibechat.log`, Linux `~/.config/tw.buildy.vibechat/logs/vibechat.log`.
          EOF
      # SHA256SUMS of every asset: vibechat-server update checks the server .deb against it before dpkg -i.
      # One list (assets.txt) is both what SHA256SUMS covers and what gets uploaded: the names must match exactly.
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          # Asset names must survive upload unchanged (GitHub turns a space into a dot), or sha256sum -c fails.
          printf '%s\n' vibechat-desktop-linux-x64.zip vibechat-desktop-windows-x64.zip vibechat-desktop-macos-arm64.zip \
            *.deb vibechat-amd64-installer.exe BuildY-VibeChat.dmg | sort -u > ../assets.txt
          while read -r f; do
            case "$f" in *[!A-Za-z0-9._-]*) echo "release: asset name GitHub would change: $f" >&2; exit 1 ;; esac
            [ -f "$f" ] || { echo "release: missing asset $f" >&2; exit 1; }
          done < ../assets.txt
          xargs -a ../assets.txt sha256sum -- > SHA256SUMS
          cat SHA256SUMS
          # Every name in SHA256SUMS is an asset and every asset is in SHA256SUMS.
          diff <(awk '{print $2}' SHA256SUMS | sort) ../assets.txt || { echo "release: SHA256SUMS names differ from the assets" >&2; exit 1; }
          sha256sum -c --strict SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l dist
          mapfile -t files < <(sed 's|^|dist/|' assets.txt)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "BuildY VibeChat $GITHUB_REF_NAME" --notes-file notes.md \
            "${files[@]}" dist/SHA256SUMS
      # What users download: the release's asset names against SHA256SUMS (both ways), then sha256sum -c on the
      # downloaded files.
      - name: Check the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep -vx SHA256SUMS | sort > published.txt
          diff published.txt assets.txt || { echo "release: published assets differ from the built ones" >&2; exit 1; }
          gh release download "$GITHUB_REF_NAME" -D published
          cd published
          diff <(awk '{print $2}' SHA256SUMS | sort) ../published.txt || { echo "release: SHA256SUMS names differ from the published assets" >&2; exit 1; }
          diff <(ls | grep -vx SHA256SUMS | sort) ../published.txt || { echo "release: downloaded files differ" >&2; exit 1; }
          sha256sum -c --strict SHA256SUMS
