name: ci
on:
  push:
    branches: [main]
    # A v* tag builds the same matrix and publishes a GitHub Release with the portable zips (job release).
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 runners are Apple Silicon (arm64): the macOS zip is the arm64 build.
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      # The app version: scripts/package.sh and the desktop build stamp it (internal/appid.Version); a v* tag wins.
      VIBECHAT_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0' }}
    defaults:
      run:
        shell: bash
    steps:
      # The submodules (buildytech/studio, buildytech/templates) are public: the job token is enough.
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Linux GUI libraries (GTK 4, WebKitGTK 6)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Studio from the pinned studio submodule
        run: bash scripts/build-frontend.sh
      - name: Vet
        run: go vet ./ ./internal/... ./cmd/...
      - name: Tests (unit, host seam contract)
        run: go test -count=1 -v ./ ./internal/... ./cmd/...
      # Project creation e2e (templates.Scaffold + host.InstallDeps, the app's code) with the oldest supported Bun and
      # the current one, under a parent folder with spaces and Cyrillic like a real user profile.
      - name: Templates install e2e (Bun 1.3.3)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Templates install e2e run (Bun 1.3.3)
        run: |
          bun --version
          d="$RUNNER_TEMP/Профиль пользователя/VibeChat 133"
          mkdir -p "$d"
          VIBECHAT_E2E_INSTALL=1 VIBECHAT_E2E_DIR="$d" go test -count=1 -v -run TestTemplatesInstallE2E .
      - name: Templates install e2e (current Bun)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Templates install e2e run (current Bun)
        run: |
          bun --version
          d="$RUNNER_TEMP/Профиль пользователя/VibeChat 144"
          mkdir -p "$d"
          VIBECHAT_E2E_INSTALL=1 VIBECHAT_E2E_DIR="$d" go test -count=1 -v -run TestTemplatesInstallE2E .
      - name: Headless build (server tag)
        run: go build -tags server -ldflags "-X github.com/buildytech/vibechat-desktop/internal/appid.Version=$VIBECHAT_VERSION" -o bin/vibechat-server ./cmd/vibechat
      - name: Desktop build
        run: go build -ldflags "-X github.com/buildytech/vibechat-desktop/internal/appid.Version=$VIBECHAT_VERSION" -o bin/vibechat ./cmd/vibechat
      - name: Packaging tools (wails3 CLI of the pinned Wails; NSIS on Windows)
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          if [ "$RUNNER_OS" = "Windows" ] && ! command -v makensis >/dev/null; then
            choco install nsis -y --no-progress >/dev/null
            echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y dpkg-dev file >/dev/null; fi
      - name: Unsigned installers and portable zips (scripts/package.sh)
        run: |
          export VIBECHAT_VERSION="${VIBECHAT_VERSION#v}"
          bash scripts/package.sh
          ls dist/vibechat-desktop-*.zip
      # Agent runtime smoke from the shipped zip: unpack under a path with spaces and Cyrillic, run the app's own
      # --bridge-smoke (locate bridge next to the exe, sandbox preflight, private HOME/USERPROFILE, ready + Ping).
      - name: Bridge smoke from the portable zip
        run: |
          root="$RUNNER_TEMP/Профиль пользователя/Downloads"
          rm -rf "$root" && mkdir -p "$root"
          zip=$(ls dist/vibechat-desktop-*.zip)
          case "$RUNNER_OS" in
            Windows) 7z x -bso0 -bsp0 -o"$root" "$zip"; exe="$root/vibechat-desktop-windows-x64/vibechat.exe" ;;
            macOS)   ditto -x -k "$zip" "$root"; exe="$root/BuildY VibeChat.app/Contents/MacOS/vibechat" ;;
            Linux)   unzip -q "$zip" -d "$root"; exe="$root/vibechat-desktop-linux-x64/vibechat" ;;
          esac
          export VIBECHAT_DATA_DIR="$RUNNER_TEMP/Профиль пользователя/AppData/tw.buildy.vibechat"
          "$exe" --version > smoke.txt 2>&1 || true
          set +e
          "$exe" --bridge-smoke >> smoke.txt 2>&1
          code=$?
          set -e
          cat smoke.txt
          echo "--- log"; cat "$VIBECHAT_DATA_DIR/logs/vibechat.log" || true
          # 3 = the runner has no SDK sandbox (GitHub Linux runners lack Landlock); the bridge is not started then.
          if [ "$code" = 3 ] && [ "$RUNNER_OS" = Linux ]; then echo "::warning::bridge smoke skipped: no SDK sandbox on this runner"; exit 0; fi
          exit $code
      # The NSIS installer layout (per-machine, Program Files, read-only for the user): the same smoke from there.
      - name: Bridge smoke from the installed app (Windows)
        if: runner.os == 'Windows'
        run: |
          powershell -NoProfile -Command "Start-Process -FilePath dist\vibechat-amd64-installer.exe -ArgumentList '/S' -Wait"
          exe="/c/Program Files/BuildY/BuildY VibeChat/vibechat.exe"
          ls -la "$(dirname "$exe")" "$(dirname "$exe")/bridge"
          unset VIBECHAT_DATA_DIR # the real default: %APPDATA%\tw.buildy.vibechat
          set +e
          "$exe" --bridge-smoke > smoke-installed.txt 2>&1
          code=$?
          set -e
          cat smoke-installed.txt
          echo "--- log"; cat "$APPDATA/tw.buildy.vibechat/logs/vibechat.log" || true
          exit $code
      # The bare executable with the agent runtime next to it (bin/bridge: cursor-sdk-bridge + sandbox helper).
      - uses: actions/upload-artifact@v4
        with:
          name: vibechat-${{ matrix.os }}
          path: |
            bin/vibechat
            bin/vibechat.exe
            bin/bridge/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: vibechat-installer-${{ matrix.os }}
          path: dist/
          retention-days: 14

  # Tag v* → GitHub Release with stable asset names, so
  # https://github.com/buildytech/vibechat-desktop/releases/latest/download/<name> always points at the newest build.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vibechat-installer-*
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          Portable builds (unzip and run; the agent runtime `bridge/` sits next to the executable):

          | System | Download | Requirements |
          |---|---|---|
          | Linux x64 | [vibechat-desktop-linux-x64.zip](https://github.com/buildytech/vibechat-desktop/releases/latest/download/vibechat-desktop-linux-x64.zip) | GTK 4 + WebKitGTK 6 (`sudo apt install libgtk-4-1 libwebkitgtk-6.0-4`), Ubuntu 24.04 / Debian 13 or newer |
          | Windows x64 | [vibechat-desktop-windows-x64.zip](https://github.com/buildytech/vibechat-desktop/releases/latest/download/vibechat-desktop-windows-x64.zip) | Windows 10/11 x64 with Microsoft Edge WebView2 (the installer adds it if missing) |
          | macOS Apple Silicon | [vibechat-desktop-macos-arm64.zip](https://github.com/buildytech/vibechat-desktop/releases/latest/download/vibechat-desktop-macos-arm64.zip) | macOS 12+ on M1 or newer |

          Installers are attached too: `.deb` (Linux), `vibechat-amd64-installer.exe` (Windows), `.dmg` (macOS).

          Builds are **not signed or notarized**.
          - macOS: after unzipping, run `xattr -dr com.apple.quarantine "BuildY VibeChat.app"` (or right-click → Open).
          - Windows: SmartScreen may warn — «More info» → «Run anyway».

          Projects need [Bun](https://bun.sh) 1.3.3 or newer on PATH (`bun upgrade`). Then `vibechat --set-key` (paste the Cursor
          API key, kept in the OS keychain) or set it in Settings.

          Log for bug reports: Windows `%APPDATA%\tw.buildy.vibechat\logs\vibechat.log`, macOS
          `~/Library/Application Support/tw.buildy.vibechat/logs/vibechat.log`, Linux `~/.config/tw.buildy.vibechat/logs/vibechat.log`.
          EOF
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "BuildY VibeChat $GITHUB_REF_NAME" --notes-file notes.md \
            dist/vibechat-desktop-linux-x64.zip dist/vibechat-desktop-windows-x64.zip dist/vibechat-desktop-macos-arm64.zip \
            dist/*.deb dist/vibechat-amd64-installer.exe "dist/BuildY VibeChat.dmg"
